name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Read-only: builds the installers from the tag with no write token or secret in reach and no caches restored
  # (a cache written by another workflow run must not end up inside a release).
  build:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No install scripts: none of our dependencies needs one on Windows (only macOS's fsevents has one), and a
      # compromised package then has one less way to tamper with the installer the sign job will vouch for.
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: Build installers
        run: npx tauri build -- --locked
      # The update e2e hook (`e2e-update` feature) must never be in a release.
      - name: Check the app has no test hooks
        shell: bash
        run: |
          if grep -q TODOPET_E2E_MANIFEST src-tauri/target/release/todopet.exe; then
            echo "::error::The release binary contains the update e2e hook"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todopet-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  # The only job that sees the updater signing key, and it runs no project code: the key can push code to every
  # install, so it must never share a job with `npm ci` or cargo. It signs the setup.exe (the one installer that
  # updates itself), checks the signature against the public key the app embeds and writes the manifest the app reads.
  # The key lives in the `updater-signing` environment; without it the release stops here instead of shipping an
  # update nobody can install.
  sign:
    name: Sign the update
    needs: build
    runs-on: ubuntu-latest
    environment: updater-signing
    permissions:
      contents: read
    steps:
      # Only for tauri.conf.json (the public key, the version) and package-lock.json (the signer's pin); nothing in
      # the checkout is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: todopet-windows-installers
          path: installers
      # Everything that can be checked before the key is touched: the tag, the versions, the updater config the app
      # ships with and the exact installer to sign. Its SHA-256 goes to the run summary so it can be compared with a
      # local build.
      - name: Check the release before signing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3, not $TAG"
            exit 1
          fi
          version="${TAG#v}"
          conf=src-tauri/tauri.conf.json
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          for v in "$(jq -r .version "$conf")" "$cargo" "$(jq -r .version package.json)"; do
            if [ "$v" != "$version" ]; then
              echo "::error::The tag $TAG does not match a version in the project ($v)"
              exit 1
            fi
          done
          # The shipped updater config: our key, signed versions required, no endpoints or dangerous switches.
          if ! jq -e '.plugins.updater
                | (.pubkey | type == "string" and length > 0)
                  and .requireSignedVersion == true
                  and (has("endpoints") | not)
                  and (has("allowDowngrades") | not)
                  and (keys | map(select(startswith("dangerous"))) | length == 0)' "$conf" > /dev/null; then
            echo "::error::plugins.updater in tauri.conf.json is not the reviewed configuration"
            exit 1
          fi
          setup="installers/nsis/TodoPet_${version}_x64-setup.exe"
          if [ ! -f "$setup" ] || [ "$(ls installers/nsis | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly $setup"
            ls -la installers/nsis
            exit 1
          fi
          {
            echo "### Installer to sign"
            echo
            echo "\`$(basename "$setup")\` SHA-256: \`$(sha256sum "$setup" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the signer and the verifier
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
          # The same Tauri CLI the build used, outside the checkout, without install scripts; then its native binary
          # must match the integrity recorded in the project's lockfile.
          version=$(jq -r '.packages["node_modules/@tauri-apps/cli"].version' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Tauri CLI version in package-lock.json: $version"
            exit 1
          fi
          signer="$RUNNER_TEMP/signer"
          mkdir -p "$signer"
          (cd "$signer" && npm install --no-audit --no-fund --ignore-scripts "@tauri-apps/cli@$version")
          for pkg in "@tauri-apps/cli" "@tauri-apps/cli-linux-x64-gnu"; do
            want=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].integrity' package-lock.json)
            got=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].integrity' "$signer/package-lock.json")
            if [ -z "$want" ] || [ "$want" = "null" ] || [ "$want" != "$got" ]; then
              echo "::error::$pkg does not match the lockfile ($got vs $want)"
              exit 1
            fi
          done
      - name: Sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the updater-signing environment. Refusing to release an update without a signature."
            exit 1
          fi
          version="${TAG#v}"
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign --app-version "$version" \
            "installers/nsis/TodoPet_${version}_x64-setup.exe"
      - name: Verify the signature and write the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          setup="installers/nsis/TodoPet_${version}_x64-setup.exe"
          sig="$setup.sig"
          # The public key the app embeds; a signature it would refuse must never reach a release.
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > "$RUNNER_TEMP/updater.pub"
          base64 -d "$sig" > "$RUNNER_TEMP/setup.minisig"
          minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$setup" -x "$RUNNER_TEMP/setup.minisig"
          # The app requires the signature to name the version it announces (no downgrade by a doctored manifest).
          comment=$(sed -n 's/^trusted comment: //p' "$RUNNER_TEMP/setup.minisig")
          if [[ "$comment" != *$'\t'"version:$version" ]]; then
            echo "::error::The signature's trusted comment does not name version $version: $comment"
            exit 1
          fi
          mkdir updater
          cp "$sig" updater/
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$setup")" \
            '{version: $version, notes: "See the release page.", pub_date: $date,
              platforms: {"windows-x86_64-nsis": {signature: $signature, url: $url}}}' > updater/latest.json
          cat updater/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todopet-updater
          path: updater/
          if-no-files-found: error
          retention-days: 7

  # The only job with a write token: it runs no project code, just drafts the release from the artifacts. A draft is
  # invisible to the app; the update reaches people when someone publishes it.
  publish:
    name: Draft the GitHub release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: todopet-windows-installers
          path: installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: todopet-updater
          path: updater
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Windows installers for TodoPet.

          - `TodoPet_*_x64-setup.exe`: installer for the current user (recommended; updates itself in one click).
          - `TodoPet_*_x64_*.msi`: MSI package (English or Vietnamese).
          - `latest.json`, `*.sig`: the signed update manifest the app reads.
          EOF
          v="${TAG#v}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "TodoPet $TAG" \
            --notes-file notes.md \
            "installers/nsis/TodoPet_${v}_x64-setup.exe" \
            "installers/msi/TodoPet_${v}_x64_en-US.msi" \
            "installers/msi/TodoPet_${v}_x64_vi-VN.msi" \
            updater/latest.json \
            "updater/TodoPet_${v}_x64-setup.exe.sig"
