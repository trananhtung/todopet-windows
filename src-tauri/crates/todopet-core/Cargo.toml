[package]
name = "todopet-core"
version = "0.1.0"
description = "OS-independent logic of the TodoPet backend: validation, Todoist/Claude payloads, calendar links, address checks, diary date math."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = "2.3"
url = "2.5"
base64 = "0.23"
# Pet-card signatures (v0.6): Ed25519 with a key from the OS's secure random source.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
